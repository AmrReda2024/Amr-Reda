name: Android Downloader APK

on:
  push:
    paths:
      - "android-downloader/**"
      - ".github/workflows/android-downloader.yml"
  pull_request:
    paths:
      - "android-downloader/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-downloader
    env:
      # Optional: the app's permanent signing key (base64 of the .keystore file).
      # With it, every build installs over the previous version; without it, CI signs with a throwaway key.
      KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build APKs
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SmartDownloader-apk
          path: |
            android-downloader/app/build/outputs/apk/release/app-arm64-v8a-release.apk
            android-downloader/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
